name: Release client (build + SignPath sign)

# Push a tag like v0.4.1 to build the client, get it code-signed by SignPath,
# attach the signed exe to a GitHub Release, and (if R2 creds are set)
# publish the split parts so the download link serves the signed build.
#
# Required repo config once SignPath Foundation has approved the project:
#   secrets.SIGNPATH_API_TOKEN            - SignPath CI user API token
#   vars.SIGNPATH_ORGANIZATION_ID         - SignPath organization id (GUID)
#   vars.SIGNPATH_PROJECT_SLUG            - e.g. error-pc-check
#   vars.SIGNPATH_SIGNING_POLICY_SLUG     - e.g. release-signing
# Optional (auto-publishes the signed build):
#   secrets.R2_ACCOUNT_ID
#   secrets.R2_ACCESS_KEY_ID
#   secrets.R2_SECRET_ACCESS_KEY
#   vars.R2_BUCKET                        - defaults to ssac-assets
#
# Note: the root package.json is tooling scaffolding (version 0.0.0), not the
# product. Release tooling that runs `npm version` will bump it to the release
# version; that drift is harmless as long as the package is never published.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-sign:
    runs-on: windows-latest
    # Single source of truth for the released asset's name. The staging step
    # and the attach step both read this, so they cannot drift apart - a
    # mismatch here silently publishes a release with no asset attached.
    env:
      RELEASE_ASSET: Error_SMP_Screenshare.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }

      # Fail in seconds, naming what is missing, instead of after ~90s of
      # Windows build with an opaque "api-token" error from the signing action.
      - name: Preflight - signing config present
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          missing=()
          [ -n "$SIGNPATH_API_TOKEN" ]            || missing+=(secrets.SIGNPATH_API_TOKEN)
          [ -n "$SIGNPATH_ORGANIZATION_ID" ]     || missing+=(vars.SIGNPATH_ORGANIZATION_ID)
          [ -n "$SIGNPATH_PROJECT_SLUG" ]         || missing+=(vars.SIGNPATH_PROJECT_SLUG)
          [ -n "$SIGNPATH_SIGNING_POLICY_SLUG" ] || missing+=(vars.SIGNPATH_SIGNING_POLICY_SLUG)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::SignPath is not configured. Missing:"
            for m in "${missing[@]}"; do echo "  - $m"; done
            echo ""
            echo "See the 'Required repo config' comment at the top of this workflow."
            exit 1
          fi
          echo "SignPath config present."

      - name: Build + obfuscate + publish
        shell: bash
        run: |
          dotnet tool restore
          bash scripts/build-client.sh
          mkdir -p dist
          cp client/ErrorSmp.Client/bin/Release/net8.0-windows/win-x64/publish/error-pc-check.exe dist/error-pc-check.exe

      - name: Upload unsigned artifact
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: dist/error-pc-check.exe

      - name: Submit to SignPath for signing
        id: sign
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Stage signed exe
        shell: bash
        run: |
          mkdir -p out
          cp "signed/error-pc-check.exe" "out/$RELEASE_ASSET"
          test -s "out/$RELEASE_ASSET" || { echo "::error::signed exe missing after staging"; exit 1; }
          sha256sum "out/$RELEASE_ASSET"

      - name: Publish signed build to Cloudflare R2
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_BUCKET" ]; then
            echo "R2 credentials are not configured; skipping R2 publication."
            exit 0
          fi
          npm ci
          node scripts/split-upload.mjs signed/error-pc-check.exe

      - name: Attach signed exe to the Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ env.RELEASE_ASSET }}
