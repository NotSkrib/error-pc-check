# SSAC local Supabase config. Run `supabase start` (needs Docker).
project_id = "ssac"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[realtime]
enabled = true

[edge_runtime]
enabled = true

[functions.ingest]
verify_jwt = false

[functions.signatures]
verify_jwt = false

[functions.download]
verify_jwt = false
