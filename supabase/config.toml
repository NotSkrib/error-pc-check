# SSAC local Supabase config. Run `supabase start` (needs Docker).
project_id = "ssac"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://ssac-panel.vercel.app"
additional_redirect_urls = [
  "https://ssac-panel.vercel.app",
  "https://ssac-panel.vercel.app/**",
  "http://localhost:5173",
  "http://localhost:5173/**"
]
jwt_expiry = 3600
# GoTrue blocks anonymous sign-ins when enable_signup is false, so this stays
# on. The panel has NO sign-up UI; a stray API signup gets no tenant membership
# and can see/do nothing (RLS). Guests use anonymous auth + join_as_guest().
enable_signup = true
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

# 2FA for staff accounts (docs/phase-0-design.md §2.2 A6). config push resets
# anything not listed to CLI defaults, so keep these explicit.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[realtime]
enabled = true

[edge_runtime]
enabled = true

[functions.ingest]
verify_jwt = false

[functions.signatures]
verify_jwt = false

[functions.download]
verify_jwt = false
