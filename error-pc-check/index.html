<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>PC Check</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center;
        font: 15px/1.6 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        color: #e9e9ec;
        background: radial-gradient(900px 500px at 50% -10%, rgba(229,72,77,0.10), transparent 60%), #07080a;
      }
      main { max-width: 26rem; padding: 2rem 1.5rem; text-align: center; }
      .m { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 9px;
           background: linear-gradient(180deg, #f2555b, #8f2c30); color: #fff; font-weight: 800; margin-bottom: 1rem; }
      h1 { font-size: 1.05rem; margin: 0 0 .5rem; }
      p { margin: .35rem 0; color: #9aa0aa; }
    </style>
  </head>
  <body>
    <main>
      <div class="m">E</div>
      <h1>Error&nbsp;SMP &mdash; PC Check</h1>
      <p>Your download should have started automatically.</p>
      <p>If it didn&rsquo;t, ask the staff member who sent you this for a fresh link.</p>
    </main>
  </body>
</html>
